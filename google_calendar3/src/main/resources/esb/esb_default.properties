# ESB baseline config, loaded into JVM system properties early by
# GoogleExtensionConfig.loadEsbPropertiesEarly(). NOTE: the broker host/port and
# credentials below are placeholders — GoogleExtensionConfig.loadEsbDetailsFromApi()
# overrides krista.esb.host/port, broker.primary.host/port and the credentials at
# construction (with the cross-namespace FQDN), so the localhost values here never
# take effect at runtime. The pool/thread/monitoring keys below DO take effect.
krista.esb.host=localhost
krista.esb.port=61616
krista.esb.username=artemis
krista.esb.password=REDACTED_SECRET
broker.primary.host=localhost
broker.primary.port=61616
broker.user.name=artemis
broker.user.pwd=simetraehcapa
# broker.dest.type is deliberately NOT set here. This file is copied into JVM system properties at
# startup, and a system property outranks the destination type krista-infra's CommanderService sets
# on its own mgmt.registry topic consumer. With it set, Commander fails ("Cannot use Queue type for
# topic consumer") and the standalone backplane participant takes over, which never acknowledges a
# DISCOVER broadcast: one stranded message on the broker every 30 s for the life of the pod. Every
# ESB config in this extension sets DestinationType.Queue explicitly, and Queue is the default.
#
# Commander's per-node ESB telemetry publisher stays off: the standalone participant it replaces
# never published it, so the broker carries the same management load as before.
commander.telemetry.esb.enabled=false

# ============================================================================
# PRODUCER SESSION POOLING (KIM-492 / P-01)
# ============================================================================
# REQUIRED, not tuning. krista-infra defaults this to false (ServiceBusConfig), and with it
# off EVERY request/reply call creates its own temporary Artemis reply queue named
# <base>-REPLY-<ver>-<uuid> with auto-delete-delay=600000 -- so a reply queue outlives its
# call by TEN MINUTES and steady-state live queues are roughly call-rate x 600s. WP-E16 moved
# this extension's Meeting Agent traffic (upsert, bulk upsert, cancel, find, list users) onto
# that path, so the queue churn arrived with it. A broker with a large population of
# auto-delete queues has wedged before: see the 2026-08-31 Artemis destroyQueue incident,
# whose symptom was Meeting Agent returning 401 because the broker stopped answering.
#
# Pooling reuses a producer session -- and therefore its reply queue -- across calls. The
# pooled path has a documented fallback in krista-infra, so an environment where pooling
# cannot be established still works; it just goes back to a queue per call.
#
# Set in CA and in every extension together: one participant left unpooled still generates
# the churn this key exists to stop.
broker.producer.session.pooling.enabled=true

# KIM-451: multi-tenant ESB destination namespace prefix. INTENTIONALLY left commented
# out (not "key="): loadEsbPropertiesEarly() copies every key verbatim into system
# properties, so an empty value would set broker.dest.namespace="" rather than leaving it
# unset. Default (unset) resolves destinations as {destName}-{version}-IN.
# GoogleExtensionConfig.loadEsbDetailsFromApi() sets broker.dest.namespace from the CA
# handshake (connectionDetails.esb.esbNamespace) when non-blank -> {namespace}.{destName}-{version}-IN.
#broker.dest.namespace=


# ============================================================================
# CONNECTION POOL CONFIGURATION
# ============================================================================
# Pool size inherited from KIP (sized for its 6 consumers). EF-34: the note here used to
# say "only 2 consumers (auth-initiate + reminder-send)" and was stale -- GoogleServiceBusManager
# starts FOUR: auth-initiate, its legacy alias, reminder-send (drain-and-ack) and
# reminder-decide. 20 is still ample headroom, but the number is no longer wrong.
krista.esb.connection.pool.size=20
krista.esb.connection.timeout=30000
krista.esb.connection.retry.attempts=3
krista.esb.connection.retry.delay=1000

# ============================================================================
# THREAD POOL CONFIGURATION FOR MESSAGE PROCESSING
# ============================================================================
# Thread-pool size inherited from KIP (sized for its 6 consumers); ample for this
# extension's four (see above). Ensures messages are processed concurrently without blocking.
krista.esb.consumer.thread.pool.size=24
krista.esb.consumer.thread.pool.queue.size=1000
krista.esb.consumer.thread.pool.keep.alive.seconds=60

# ============================================================================
# CONSUMER HEALTH MONITORING AND RECOVERY CONFIGURATION
# ============================================================================
# Idle timeout for consumers: restart consumers that haven't processed messages
# for this duration to prevent stale JMS connections (AMQ219017 errors)
# Default: 24 hours (86400000 ms)
# Set to 0 to disable idle timeout-based restarts
krista.esb.consumer.idle.timeout.millis=86400000

# Health check interval for detecting dead/stale consumers
# Default: 30 seconds
krista.esb.consumer.health.check.interval.seconds=30

# ============================================================================
# MESSAGE PROCESSING CONFIGURATION
# ============================================================================
krista.esb.message.timeout=60000
krista.esb.message.retry.attempts=3
krista.esb.message.retry.delay=1000
krista.esb.producer.time.to.live=0
krista.esb.ssl.enabled=false

# ============================================================================
# MEETING AGENT CALL BUDGETS (KIM-492 / EF-02)
# ============================================================================
# How long ONE Meeting Agent ESB call may wait for its reply, in milliseconds.
#
# These exist because the shipped krista-infra default (broker.response.timeout) is TEN
# MINUTES, and nothing in this extension narrowed it. Before WP-E16 every MA call was HTTP:
# with MA down the socket refused immediately and the sweep moved on. On the ESB the request
# is enqueued and the caller waits on a temporary reply queue -- so a MA outage turned each
# call into a ten-minute stall, on sweeps that run on the Studio request thread where a
# person is watching.
#
# Applied by EsbCaGateway via a per-call ServiceBusConfig copy carrying setResponseTimeout,
# which is what QRequester.receive() actually waits on. NOT via Input.setTimeout: that is a
# no-op default interface method which MA's generated request DTOs do not override, so
# setting it would change nothing. See CaCallBudget's javadoc.
#
# Clamped to [1000, 120000] ms by CaCallBudget. The ceiling is the point: an operator who
# "fixes" a slow sweep by setting ten minutes here has reinstated the bug.
#
# request     -- one row in, one row out: upsertMeeting, cancelMeeting, findMeetings.
# bulkRequest -- batched or paged: bulkUpsertMeetings (up to maxMeetings, each classified
#                and persisted MA-side) and one page of the seat roster (up to 1000 users).
ca.esb.request.timeoutMs=30000
ca.esb.bulkRequest.timeoutMs=60000

# EF-29: MA's cap on meetings per bulkUpsertMeetings request. Over it MA rejects the WHOLE
# batch with VALIDATION_ERROR, so this tracks MA's contract rather than a preference -- the
# key exists so an MA that raises its cap does not need an extension release. Clamped to
# [1, 1000].
ca.esb.bulkRequest.maxMeetings=50

# ============================================================================
# CRITICAL: WORKAROUND FOR SLF4J CONFLICT
# ============================================================================
# The runtime environment forces an older SLF4J 1.x binding which
# causes a NoSuchMethodError in ResourceMonitor (built against SLF4J 2.x).
# We MUST disable all monitoring to prevent this crash.
krista.monitor.resource.enabled=false
krista.monitoring.enabled=false
krista.pulse.ResourceMonitor-HealthCheck.enabled=false
